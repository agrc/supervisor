[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src"]
norecursedirs = [".env", "data", "maps", ".github", ".vscode"]
console_output_style = "count"
addopts = "--cov-branch --cov=supervisor --cov-report term --cov-report xml:cov.xml --instafail -p no:faulthandler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ugrc-supervisor"
version = "3.3.0"
description = "A watchdog module for scheduled scripts that sends notifications, including any uncaught exceptions."
license = "MIT"
authors = [{ name = "UGRC", email = "ugrc-developers@utah.gov" }]
keywords = ["gis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Utilities",
]
dependencies = ["requests>=2.20.0", "sendgrid==6.*"]

[project.optional-dependencies]
tests = [
  "pytest-cov>=6,<8",
  "pytest-instafail==0.5.*",
  "pytest-mock==3.*",
  "pytest-watch==4.*",
  "pytest>=8,<10",
  "ruff==0.*",
]

[project.urls]
Homepage = "https://github.com/agrc/supervisor"
"Issue Tracker" = "https://github.com/agrc/supervisor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/supervisor"]
